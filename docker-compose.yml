version: '3.8'

services:
  # ── Backend (FastAPI) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calorie-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_API_BASE_URL=https://api.deepseek.com
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=deepseek-chat
      - HF_API_KEY=${HF_API_KEY}
      - HF_MODEL=nateraw/food101
      - VISION_MODE=real
      - VITE_API_URL=http://localhost:8000
      - DATABASE_URL=sqlite+aiosqlite:///data/calories.db
      - ALLOW_ORIGINS=["*"]
      - LOG_LEVEL=INFO
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - calorie-net

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:1.25-alpine
    container_name: calorie-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro       # Place Let's Encrypt certs here
      - certbot-data:/var/www/certbot
    depends_on:
      - backend
    networks:
      - calorie-net

  # ── Certbot (Let's Encrypt auto-renewal) ──
  certbot:
    image: certbot/certbot:latest
    container_name: calorie-certbot
    volumes:
      - ./ssl:/etc/letsencrypt:rw
      - certbot-data:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h; done'"
    profiles:
      - production

  # ── Prometheus (Metrics) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: calorie-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    networks:
      - calorie-net

  # ── Grafana (Visualization) ──
  grafana:
    image: grafana/grafana:latest
    container_name: calorie-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    profiles:
      - monitoring
    networks:
      - calorie-net

  # ── PostgreSQL (Production Database) ──
  postgres:
    image: postgres:16-alpine
    container_name: calorie-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=calorie_assistant
      - POSTGRES_USER=${DB_USER:-calorie}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles:
      - production
    networks:
      - calorie-net

  # ── Database Backup (Daily Snapshot) ──
  db-backup:
    image: postgres:16-alpine
    container_name: calorie-db-backup
    restart: unless-stopped
    entrypoint: |
      /bin/sh -c '
        apk add --no-cache postgresql-client
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S)
          PGPASSWORD=$${DB_PASSWORD:-changeme} pg_dump -h postgres -U $${DB_USER:-calorie} calorie_assistant > /backups/calorie_$${DATE}.sql
          echo "[BACKUP] Created calorie_$${DATE}.sql"
          # Keep only last 7 days
          find /backups -name "calorie_*.sql" -mtime +7 -delete
          sleep 86400
        done
      '
    environment:
      - DB_USER=${DB_USER:-calorie}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - db-backups:/backups
    profiles:
      - production
    depends_on:
      - postgres
    networks:
      - calorie-net

volumes:
  backend-data:
  backend-uploads:
  certbot-data:
  prometheus-data:
  grafana-data:
  postgres-data:
  db-backups:

networks:
  calorie-net:
    driver: bridge
